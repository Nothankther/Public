name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/auto-control-principles
          cp auto-control-principles/index.html _site/auto-control-principles/index.html
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>课程复习资料</title>
          <style>
            body{max-width:720px;margin:0 auto;padding:56px 24px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1a1a1a;line-height:1.8}
            h1{font-size:24px;margin:0 0 6px}
            p.sub{color:#666;font-size:14px;margin:0 0 32px}
            a.card{display:block;padding:18px 20px;border:1px solid #e5e7eb;border-radius:10px;text-decoration:none;color:inherit;transition:.15s}
            a.card:hover{border-color:#0f766e;box-shadow:0 2px 10px rgba(15,118,110,.08)}
            a.card b{font-size:16px;color:#0f766e}
            a.card span{display:block;font-size:13px;color:#666;margin-top:4px}
          </style>
          </head>
          <body>
            <h1>课程复习资料</h1>
            <p class="sub">单文件 HTML，离线可用，可直接打印</p>
            <a class="card" href="auto-control-principles/">
              <b>自动控制原理</b>
              <span>胡寿松第八版 · 11 章 + 8 附录 · 2716 个公式 · 12 张矢量图 · 交互控件</span>
            </a>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
