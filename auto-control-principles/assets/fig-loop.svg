<svg viewBox="0 0 820 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="典型闭环控制系统方框图" style="font-family:'Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- 输入 -->
  <line x1="16" y1="130" x2="106" y2="130" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="16" y="116" font-size="12.5" fill="#334155">r(t)</text>
  <text x="16" y="152" font-size="11" fill="#94a3b8">给定值</text>

  <!-- 比较点 -->
  <circle cx="130" cy="130" r="18" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="118" y="118" font-size="13" fill="#334155">+</text>
  <text x="128" y="155" font-size="13" fill="#334155">−</text>

  <!-- 前向通道 -->
  <line x1="148" y1="130" x2="192" y2="130" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <rect x="196" y="102" width="110" height="56" rx="8" fill="#eef3ff" stroke="#b9c9f0" stroke-width="1.4"/>
  <text x="251" y="135" text-anchor="middle" font-size="13" fill="#16357f">放大元件</text>

  <line x1="306" y1="130" x2="342" y2="130" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <rect x="346" y="102" width="120" height="56" rx="8" fill="#eef3ff" stroke="#b9c9f0" stroke-width="1.4"/>
  <text x="406" y="135" text-anchor="middle" font-size="13" fill="#16357f">执行机构</text>

  <line x1="466" y1="130" x2="502" y2="130" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <rect x="506" y="102" width="130" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="571" y="135" text-anchor="middle" font-size="13" fill="#334155">被控对象</text>

  <line x1="636" y1="130" x2="758" y2="130" stroke="#475569" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="700" y="118" font-size="12.5" fill="#334155">c(t)</text>
  <text x="700" y="152" font-size="11" fill="#94a3b8">被控量</text>

  <!-- 扰动 -->
  <line x1="571" y1="44" x2="571" y2="98" stroke="#b45309" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="580" y="60" font-size="12" fill="#b45309">n(t) 扰动</text>

  <!-- 反馈通道 -->
  <circle cx="660" cy="130" r="3.5" fill="#475569"/>
  <path d="M660,130 L660,250 L462,250" stroke="#475569" stroke-width="1.6" fill="none"/>
  <rect x="330" y="222" width="132" height="56" rx="8" fill="#eefaf7" stroke="#a7ddd0" stroke-width="1.4"/>
  <text x="396" y="255" text-anchor="middle" font-size="13" fill="#0f5f59">测量元件</text>
  <path d="M330,250 L130,250 L130,150" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a1)"/>
  <text x="150" y="272" font-size="11" fill="#94a3b8">反馈信号（负反馈）</text>

  <!-- 分组标注 -->
  <path d="M196,66 L196,58 L466,58 L466,66" stroke="#93a3bb" stroke-width="1" fill="none"/>
  <text x="331" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">控制装置</text>
</svg>
