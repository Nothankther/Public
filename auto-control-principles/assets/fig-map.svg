<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="自动控制原理知识地图" style="font-family:'Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c7a06a"/>
    </marker>
  </defs>

  <!-- 主链 -->
  <g>
    <rect x="18" y="48" width="148" height="90" rx="12" fill="#eef3ff" stroke="#c7d5f5" stroke-width="1.4"/>
    <text x="92" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#16357f">① 建模</text>
    <text x="92" y="100" text-anchor="middle" font-size="11.5" fill="#4a5b7a">微分方程 · 线性化</text>
    <text x="92" y="118" text-anchor="middle" font-size="11.5" fill="#4a5b7a">机电/电路/液位</text>
  </g>
  <g>
    <rect x="206" y="48" width="148" height="90" rx="12" fill="#eef3ff" stroke="#c7d5f5" stroke-width="1.4"/>
    <text x="280" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#16357f">② 传递函数</text>
    <text x="280" y="100" text-anchor="middle" font-size="11.5" fill="#4a5b7a">结构图等效变换</text>
    <text x="280" y="118" text-anchor="middle" font-size="11.5" fill="#4a5b7a">信号流图 · 梅森公式</text>
  </g>
  <g>
    <rect x="394" y="48" width="148" height="90" rx="12" fill="#1d4ed8" stroke="#1d4ed8"/>
    <text x="468" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">③ 性能分析</text>
    <text x="468" y="100" text-anchor="middle" font-size="11.5" fill="#dbe7ff">稳 · 准 · 快</text>
    <text x="468" y="118" text-anchor="middle" font-size="11.5" fill="#dbe7ff">三条技术路线</text>
  </g>
  <g>
    <rect x="602" y="48" width="200" height="90" rx="12" fill="#eefaf7" stroke="#a7ddd0" stroke-width="1.4"/>
    <text x="702" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#0f5f59">④ 校正设计</text>
    <text x="702" y="100" text-anchor="middle" font-size="11.5" fill="#3f6f6a">超前 / 滞后 / PID</text>
    <text x="702" y="118" text-anchor="middle" font-size="11.5" fill="#3f6f6a">反馈校正 · 复合控制</text>
  </g>

  <!-- 主链箭头 -->
  <line x1="166" y1="93" x2="200" y2="93" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="354" y1="93" x2="388" y2="93" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="542" y1="93" x2="596" y2="93" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 分流脊线 -->
  <path d="M468,138 L468,190" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M133,190 L657,190" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M133,190 L133,230" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M395,190 L395,230" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M657,190 L657,230" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- 三种分析法 -->
  <g>
    <rect x="18" y="236" width="232" height="86" rx="11" fill="#ffffff" stroke="#dfe7f5" stroke-width="1.4"/>
    <text x="36" y="262" font-size="13.5" font-weight="700" fill="#1e293b">时域分析法（第 3 章）</text>
    <text x="36" y="284" font-size="11.5" fill="#5b6779">劳斯判据 · 二阶指标 σ%、t_s</text>
    <text x="36" y="303" font-size="11.5" fill="#5b6779">静态误差系数 · 终值定理</text>
  </g>
  <g>
    <rect x="278" y="236" width="232" height="86" rx="11" fill="#ffffff" stroke="#dfe7f5" stroke-width="1.4"/>
    <text x="296" y="262" font-size="13.5" font-weight="700" fill="#1e293b">根轨迹法（第 4 章）</text>
    <text x="296" y="284" font-size="11.5" fill="#5b6779">幅值条件 |GH|=1 · 相角条件</text>
    <text x="296" y="303" font-size="11.5" fill="#5b6779">绘制八规则 · 主导极点配置</text>
  </g>
  <g>
    <rect x="538" y="236" width="232" height="86" rx="11" fill="#ffffff" stroke="#dfe7f5" stroke-width="1.4"/>
    <text x="556" y="262" font-size="13.5" font-weight="700" fill="#1e293b">频域分析法（第 5 章）</text>
    <text x="556" y="284" font-size="11.5" fill="#5b6779">Nyquist 图 · Bode 图</text>
    <text x="556" y="303" font-size="11.5" fill="#5b6779">奈氏判据 · 相位/幅值裕度</text>
  </g>

  <!-- 推广到两类特殊系统 -->
  <path d="M133,322 L133,376" stroke="#c7a06a" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#ar2)"/>
  <path d="M657,322 L657,376" stroke="#c7a06a" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#ar2)"/>
  <text x="140" y="352" font-size="10.5" fill="#a16207">推广</text>
  <text x="664" y="352" font-size="10.5" fill="#a16207">推广</text>

  <g>
    <rect x="18" y="380" width="352" height="66" rx="11" fill="#fff8ec" stroke="#f0d7ac" stroke-width="1.4"/>
    <text x="36" y="406" font-size="13.5" font-weight="700" fill="#92400e">离散系统（第 7 章）</text>
    <text x="36" y="429" font-size="11.5" fill="#7c5a2a">采样定理 · z 变换 · 脉冲传递函数 · w 变换判稳 · 最少拍</text>
  </g>
  <g>
    <rect x="404" y="380" width="366" height="66" rx="11" fill="#fff8ec" stroke="#f0d7ac" stroke-width="1.4"/>
    <text x="422" y="406" font-size="13.5" font-weight="700" fill="#92400e">非线性系统（第 8 章）</text>
    <text x="422" y="429" font-size="11.5" fill="#7c5a2a">描述函数法 · 相平面法 · 自振（极限环）分析</text>
  </g>
</svg>
