<svg viewBox="0 0 820 214" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="结构图三种基本连接" style="font-family:'Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 串联 -->
  <text x="24" y="26" font-size="12.5" font-weight="700" fill="#16357f">（a）串联</text>
  <line x1="24" y1="76" x2="52" y2="76" stroke="#475569" stroke-width="1.5" marker-end="url(#b1)"/>
  <text x="22" y="66" font-size="11" fill="#64748b">R</text>
  <rect x="56" y="52" width="58" height="48" rx="7" fill="#eef3ff" stroke="#b9c9f0" stroke-width="1.3"/>
  <text x="85" y="81" text-anchor="middle" font-size="13" fill="#16357f">G₁</text>
  <line x1="114" y1="76" x2="136" y2="76" stroke="#475569" stroke-width="1.5" marker-end="url(#b1)"/>
  <rect x="140" y="52" width="58" height="48" rx="7" fill="#eef3ff" stroke="#b9c9f0" stroke-width="1.3"/>
  <text x="169" y="81" text-anchor="middle" font-size="13" fill="#16357f">G₂</text>
  <line x1="198" y1="76" x2="238" y2="76" stroke="#475569" stroke-width="1.5" marker-end="url(#b1)"/>
  <text x="242" y="80" font-size="11" fill="#64748b">C</text>
  <text x="24" y="140" font-size="13" fill="#0f172a">G = G₁·G₂　（首尾相接，增益相乘）</text>

  <!-- 并联 -->
  <text x="300" y="26" font-size="12.5" font-weight="700" fill="#16357f">（b）并联</text>
  <line x1="300" y1="76" x2="326" y2="76" stroke="#475569" stroke-width="1.5"/>
  <circle cx="330" cy="76" r="3" fill="#475569"/>
  <path d="M330,76 L330,50 L352,50" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#b1)"/>
  <path d="M330,76 L330,102 L352,102" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#b1)"/>
  <rect x="356" y="30" width="56" height="40" rx="7" fill="#eef3ff" stroke="#b9c9f0" stroke-width="1.3"/>
  <text x="384" y="55" text-anchor="middle" font-size="13" fill="#16357f">G₁</text>
  <rect x="356" y="82" width="56" height="40" rx="7" fill="#eef3ff" stroke="#b9c9f0" stroke-width="1.3"/>
  <text x="384" y="107" text-anchor="middle" font-size="13" fill="#16357f">G₂</text>
  <path d="M412,50 L440,50 L440,76" stroke="#475569" stroke-width="1.4" fill="none"/>
  <path d="M412,102 L440,102 L440,76" stroke="#475569" stroke-width="1.4" fill="none"/>
  <circle cx="446" cy="76" r="8" fill="#fff" stroke="#475569" stroke-width="1.3"/>
  <text x="442" y="80" font-size="10" fill="#334155">+</text>
  <line x1="454" y1="76" x2="496" y2="76" stroke="#475569" stroke-width="1.5" marker-end="url(#b1)"/>
  <text x="500" y="80" font-size="11" fill="#64748b">C</text>
  <text x="300" y="140" font-size="13" fill="#0f172a">G = G₁ ± G₂　（同一信号分流再汇合，代数相加）</text>
  <text x="300" y="178" font-size="11.5" fill="#b45309">注：相加还是相减，取决于汇合点处标注的符号</text>

  <!-- 反馈 -->
  <text x="580" y="26" font-size="12.5" font-weight="700" fill="#16357f">（c）反馈</text>
  <line x1="580" y1="76" x2="606" y2="76" stroke="#475569" stroke-width="1.5" marker-end="url(#b1)"/>
  <circle cx="618" cy="76" r="12" fill="#fff" stroke="#475569" stroke-width="1.3"/>
  <text x="610" y="68" font-size="10" fill="#334155">+</text>
  <text x="610" y="88" font-size="10" fill="#334155">−</text>
  <line x1="630" y1="76" x2="654" y2="76" stroke="#475569" stroke-width="1.5" marker-end="url(#b1)"/>
  <rect x="658" y="52" width="62" height="48" rx="7" fill="#eef3ff" stroke="#b9c9f0" stroke-width="1.3"/>
  <text x="689" y="81" text-anchor="middle" font-size="13" fill="#16357f">G</text>
  <line x1="720" y1="76" x2="796" y2="76" stroke="#475569" stroke-width="1.5" marker-end="url(#b1)"/>
  <circle cx="758" cy="76" r="3" fill="#475569"/>
  <path d="M758,76 L758,152 L618,152 L618,88" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#b1)"/>
  <rect x="662" y="136" width="62" height="34" rx="7" fill="#eefaf7" stroke="#a7ddd0" stroke-width="1.3"/>
  <text x="693" y="158" text-anchor="middle" font-size="13" fill="#0f5f59">H</text>
  <text x="580" y="196" font-size="13" fill="#0f172a">Φ = G / (1 + GH)　（“1”来自主通道，GH 为回路增益）</text>
</svg>
